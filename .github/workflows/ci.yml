name: CI
on:
  push: { branches: [main, "claude/**"] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rag" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-models-v1 }
      - run: pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q tests --ignore=tests/integration
      - name: Integration tests (Postgres + Redis + embedded Qdrant + real models)
        run: pytest -q tests/integration
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag_test
          TEST_REDIS_URL: redis://localhost:6379/15
      - name: Retrieval benchmark smoke run (no LLM)
        run: python -m eval.run --no-generation --limit 30 --qdrant ":memory:" --run-name ci_smoke

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
