# Render Blueprint — see docs/DEPLOYMENT.md. Creates: API (web), ingestion worker, static frontend,
# private Qdrant with a persistent disk, managed PostgreSQL and Render Key Value (Redis).
databases:
  - name: edi-postgres
    plan: basic-256mb
    databaseName: rag
    user: rag

services:
  - type: keyvalue
    name: edi-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: pserv
    name: edi-qdrant
    runtime: image
    image: { url: docker.io/qdrant/qdrant:v1.12.4 }
    plan: starter
    disk: { name: qdrant-storage, mountPath: /qdrant/storage, sizeGB: 10 }

  - type: web
    name: edi-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: standard              # >= 2 GB RAM: embedding + reranker models are loaded per process
    healthCheckPath: /health
    disk: { name: uploads, mountPath: /data/uploads, sizeGB: 10 }
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: edi-postgres, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: edi-redis, property: connectionString }
      - key: QDRANT_HOST
        fromService: { type: pserv, name: edi-qdrant, property: hostport }
      - key: INGEST_MODE
        value: inline           # the uploads disk is attached to this service only
      - key: OPENAI_API_KEY
        sync: false             # set in the dashboard
      - key: CORS_ORIGINS
        value: https://edi-frontend.onrender.com

  - type: web
    name: edi-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://edi-api.onrender.com
    routes:
      - { type: rewrite, source: /*, destination: /index.html }
