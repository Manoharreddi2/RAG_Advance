# Full stack: docker compose up --build   ->  UI http://localhost:8080 · API docs http://localhost:8000/docs
name: document-intelligence

x-backend: &backend
  build: ./backend
  env_file: [{ path: ./backend/.env, required: false }]
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    INGEST_MODE: queue
    JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    LLM_PROVIDER: ${LLM_PROVIDER:-auto}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    CORS_ORIGINS: http://localhost:8080,http://localhost:5173
  volumes: [uploads:/data/uploads, hf-cache:/opt/hf]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    qdrant: { condition: service_started }

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag }
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rag"], interval: 5s, retries: 20 }
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }
    ports: ["6379:6379"]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes: [qdrant-data:/qdrant/storage]
    ports: ["6333:6333"]

  api:
    <<: *backend
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: ["arq", "app.ingestion.worker.WorkerSettings"]
    healthcheck: { disable: true }

  frontend:
    build: ./frontend
    environment: { API_UPSTREAM: http://api:8000 }
    ports: ["8080:8080"]
    depends_on: [api]

  # Optional open-source LLM: docker compose --profile ollama up, then set
  # OPENAI_BASE_URL=http://ollama:11434/v1 OPENAI_MODEL=llama3.1:8b LLM_PROVIDER=openai_compatible
  ollama:
    image: ollama/ollama:0.5.4
    profiles: [ollama]
    volumes: [ollama-data:/root/.ollama]
    ports: ["11434:11434"]

volumes: { pg-data: {}, redis-data: {}, qdrant-data: {}, uploads: {}, hf-cache: {}, ollama-data: {} }
